<nav class="filter">
  <ul>
    <li>
      <button class="active" data-tag="all" data-title="{{ site.title | escape }} | {{ site.description | escape }}">All</button>
    </li>
    {%- assign categories = site.pages | where_exp: "p", "p.tag" | sort: "order" -%}
    {%- for category in categories %}
    <li>
      <button data-slug="{{ category.name | remove: '.md' }}" data-tag="{{ category.tag }}" data-title="{{ category.title | escape }} | {{ site.title | escape }}">{{ category.title }}</button>
    </li>
    {%- endfor %}
    <li>
      <button data-action="show-search">
        <i class="icon search"></i>
        <span class="offscreen">Search</span>
      </button>
      <input id="search" type="search" name="search" placeholder="Type your search here" />
    </li>
  </ul>
</nav>
